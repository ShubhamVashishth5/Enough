# Builds a signed release APK.
#
#  - Push a tag such as v0.1.0: tests run, the APK is signed and attached to a new GitHub Release.
#  - Run it by hand (Actions > Release > Run workflow): the APK is uploaded as a build artifact only.
#
# Signing needs four repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   the keystore file, base64-encoded (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# Tag builds fail without them. Manual runs without them build an unsigned APK, which can't be installed
# until it's signed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android SDK platform this project compiles against
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Refuse to publish an unsigned release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Add the RELEASE_KEYSTORE_* secrets before tagging a release (see the top of release.yml)."
          exit 1

      - name: Restore the signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ENOUGH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and release build
        env:
          ENOUGH_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ENOUGH_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ENOUGH_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Name the APK after the version
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="$(git rev-parse --short HEAD)"; fi
          dir=app/build/outputs/apk/release
          if [ -f "$dir/app-release.apk" ]; then
            name="enough-$version.apk"
            cp "$dir/app-release.apk" "$name"
          else
            name="enough-$version-unsigned.apk"
            cp "$dir/app-release-unsigned.apk" "$name"
            echo "::warning::No signing secrets, so this APK is unsigned and can't be installed as-is."
          fi
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          generate_release_notes: true

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
